<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Marks</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <h1>Edit Marks</h1>
        <p>Update student marks</p>
    </header>

    <div class="marks-form">

        <h2>Edit Marks Record</h2>

        <form method="POST">

            <!-- Student -->
            <label for="student_id">
                Student
            </label>

            <select id="student_id"
                    name="student_id"
                    required>

                <option value="">
                    Select Student
                </option>

                {% for student in students %}

                    <option value="{{ student['id'] }}"
                        {% if student['id'] == mark['student_id'] %}
                            selected
                        {% endif %}>

                        {{ student['name'] }}

                    </option>

                {% endfor %}

            </select>


            <!-- Subject -->
            <label for="subject_id">
                Subject
            </label>

            <select id="subject_id"
                    name="subject_id"
                    required>

                <option value="">
                    Select Subject
                </option>

                {% for subject in subjects %}

                    <option value="{{ subject['id'] }}"
                        {% if subject['id'] == mark['subject_id'] %}
                            selected
                        {% endif %}>

                        {{ subject['name'] }}

                    </option>

                {% endfor %}

            </select>


            <!-- Marks Obtained -->
            <label for="marks_obtained">
                Marks Obtained
            </label>

            <input
                type="number"
                id="marks_obtained"
                name="marks_obtained"
                value="{{ mark['marks_obtained'] }}"
                min="0"
                required
            >


            <!-- Total Marks -->
            <label for="total_marks">
                Total Marks
            </label>

            <input
                type="number"
                id="total_marks"
                name="total_marks"
                value="{{ mark['total_marks'] }}"
                min="1"
                required
            >


            <!-- Update Button -->
            <button type="submit" class="button">
                Update Marks
            </button>

        </form>

        <br>

        <!-- Back Button -->
        <a href="/" class="button">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
